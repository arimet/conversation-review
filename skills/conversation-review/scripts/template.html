<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} · Conversation review</title>
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --ink: #1c1b19; --muted: #67625a; --line: #e2ded6;
  --code-bg: #f1efe9; --accent: #2b59c3;
  --intention: #6d46c7; --evidence: #a86a12; --control: #b9461a; --positive: #2c7a4b;
  --green: #2c7a4b; --orange: #b7770f; --red: #b83232;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141311; --surface: #1c1b18; --ink: #ebe7e0; --muted: #a29c92; --line: #33302b;
    --code-bg: #24221e; --accent: #8ea8ff;
    --intention: #b49ef2; --evidence: #e2b356; --control: #f08f63; --positive: #6cc495;
    --green: #6cc495; --orange: #e5aa45; --red: #f27a7a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
a { color: var(--accent); }
code, pre { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; max-width: 1160px;
  margin: 0 auto; padding: 40px 24px 96px; }
.report-head { grid-column: 1 / -1; border-bottom: 1px solid var(--line); padding-bottom: 28px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 6px 0 4px; font-size: 28px; line-height: 1.25; }
.meta { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.goal-line { margin: 20px 0 10px; color: var(--muted); font-size: 14px; }
.goal { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0; margin: 0; }
.goal-card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--line);
  border-radius: 8px; padding: 12px 14px; }
.goal-card.green { border-top-color: var(--green); }
.goal-card.orange { border-top-color: var(--orange); }
.goal-card.red { border-top-color: var(--red); }
.goal-card h3 { margin: 0 0 6px; font-size: 14px; }
.figures { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.figures li { display: flex; justify-content: space-between; gap: 8px; }
.figures span { color: var(--muted); }
.figures strong { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.goal-light { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
.summary { margin-top: 24px; }
.summary h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.summary dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0; }
.summary dl div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.summary dt { font-weight: 600; margin-bottom: 4px; }
.summary dd { margin: 0; }
.tag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 8px; border: 1px solid currentColor; }
.tag.axis-intention { color: var(--intention); }
.tag.axis-evidence { color: var(--evidence); }
.tag.axis-control { color: var(--control); }
.tag.criterion { color: var(--muted); }
.closing { margin-top: 40px; color: var(--muted); font-style: italic; }
.verdict { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  padding: 0; margin: 24px 0 0; }
.verdict li { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--muted);
  border-radius: 8px; padding: 12px 14px; }
.verdict li.green { border-top-color: var(--green); }
.verdict li.orange { border-top-color: var(--orange); }
.verdict li.red { border-top-color: var(--red); }
.verdict a { color: inherit; text-decoration: none; display: flex; justify-content: space-between; align-items: baseline; }
.level { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.green .level { color: var(--green); }
.orange .level { color: var(--orange); }
.red .level { color: var(--red); }
.verdict p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.sidebar nav { position: sticky; top: 24px; }
.sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.sidebar ol { margin: 0 0 16px; padding-left: 20px; }
.sidebar li { margin: 4px 0; }
.filters { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.filters button { font: inherit; text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  display: flex; justify-content: space-between; }
.filters button[aria-pressed="true"] { border-color: var(--ink); }
.filters .axis-intention { border-left: 4px solid var(--intention); }
.filters .axis-evidence { border-left: 4px solid var(--evidence); }
.filters .axis-control { border-left: 4px solid var(--control); }
.phase { margin-bottom: 40px; }
.phase h2 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
.phase-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.phase-summary { margin: 0 0 16px; color: var(--muted); }
.ev { margin: 8px 0; }
article.ev { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
article.user-message { border-left: 4px solid var(--accent); }
.ev header { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.ev .who { font-weight: 600; color: var(--ink); }
.ev time { margin-left: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.anchor { color: var(--muted); text-decoration: none; font: 12px ui-monospace, monospace; }
details.ev { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
details.ev > summary { cursor: pointer; padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px;
  align-items: baseline; list-style: none; }
details.ev > summary::-webkit-details-marker { display: none; }
details.ev > summary::before { content: "▸"; color: var(--muted); }
details.ev[open] > summary::before { content: "▾"; }
details.ev > :not(summary) { margin: 0 12px 10px; }
details.group { background: transparent; }
.tool { font-weight: 600; }
summary code { overflow-wrap: anywhere; color: var(--muted); }
.diff ins { color: var(--positive); text-decoration: none; }
.diff del { color: var(--red); text-decoration: none; }
.error { color: var(--red); font-size: 12px; text-transform: uppercase; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.axis-intention { background: var(--intention); }
.dot.axis-evidence { background: var(--evidence); }
.dot.axis-control { background: var(--control); }
.children { border-left: 2px solid var(--line); padding-left: 12px; }
pre.out, pre.input { background: var(--code-bg); border-radius: 6px; padding: 10px 12px; overflow-x: auto;
  white-space: pre-wrap; overflow-wrap: anywhere; }
pre.clamp { max-height: 30em; overflow: hidden; }
button.more { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.badge { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-top: 8px; font-size: 14px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; color: var(--surface); background: var(--muted); }
.axis-intention .pill { background: var(--intention); }
.axis-evidence .pill { background: var(--evidence); }
.axis-control .pill { background: var(--control); }
.badge.positive .pill { background: var(--positive); }
.origin { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.warning { border: 1px solid var(--orange); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.improvements ol { padding-left: 22px; }
.improvements li { margin-bottom: 18px; }
.improvements .label { margin: 6px 0 2px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--positive); background: var(--surface); white-space: pre-wrap; }
body[data-filter="intention"] .ev:not(.has-intention),
body[data-filter="evidence"] .ev:not(.has-evidence),
body[data-filter="control"] .ev:not(.has-control) { display: none; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 24px 16px 64px; }
  .sidebar nav { position: static; }
  .verdict, .summary dl { grid-template-columns: minmax(0, 1fr); }
  .goal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
  .goal { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  body { background: #fff; color: #000; }
  .sidebar, button.more { display: none; }
  .layout { display: block; max-width: none; padding: 0; }
  pre.clamp { max-height: none; }
  article.ev, .verdict li { break-inside: avoid; }
}
</style>
</head>
<body data-filter="">
<div class="layout">{{BODY}}</div>
<script>
document.addEventListener('click', (event) => {
  const link = event.target.closest('a[href^="#"]');
  if (link) {
    reveal(link.getAttribute('href').slice(1));
    return;
  }
  const more = event.target.closest('button.more');
  if (more) {
    const pre = more.previousElementSibling;
    pre.classList.toggle('clamp');
    more.textContent = pre.classList.contains('clamp') ? 'Show all' : 'Show less';
    return;
  }
  const filter = event.target.closest('button[data-filter]');
  if (filter) {
    document.body.dataset.filter = filter.dataset.filter;
    document.querySelectorAll('button[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === filter)));
    if (filter.dataset.filter) {
      document.querySelectorAll('details.has-' + filter.dataset.filter).forEach((d) => { d.open = true; });
    }
  }
});
// Opens the collapsed parents of a target. Also runs on click: re-clicking the current #eN fires no hashchange.
function reveal(id) {
  id = id || location.hash.slice(1);
  const target = id && document.getElementById(id);
  if (!target) return;
  let details = target.tagName === 'DETAILS' ? target : target.closest('details');
  while (details) {
    details.open = true;
    details = details.parentElement && details.parentElement.closest('details');
  }
  target.scrollIntoView();
}
window.addEventListener('hashchange', () => reveal());
reveal();
</script>
</body>
</html>
